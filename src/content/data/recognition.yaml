- id: nickgray
  heading: "Cloudflare Workers Tech Talks — FlareGuard: Automating Security Posture at the Edge"
  date: 2025-12-04
  url: "https://nickgray.net/cloudflare-workers-tech-talks/"
  description: >-
    Independent writeup by Nick Gray from Austin's first Cloudflare Workers
    Tech Talks, where Harshad presented FlareGuard alongside Cloudflare's own
    engineers — including Kenton Varda (founder of Cloudflare Workers). Nick
    documented three key insights from the talk: the invisible risk of edge
    misconfigurations (exposed .env vars, outdated TLS), FlareGuard's Gold
